name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - id: pack
        shell: bash
        run: |
          archive="$(npm pack --silent)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          sha256sum "$archive" > SHA256SUMS.txt
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## dsh-superlcm standalone

          DSH 独立版：会话归档、后台分层摘要与可选比例压缩，全部在 DSH 插件页管理。
          默认由 DSH 原生压缩保护上下文。后台摘要与接管模型分别选择，保留旧版数据库和召回工具。

          A DSH-only plugin with native UI, complete original archiving, hierarchical summaries and optional ratio-based compaction. Native DSH compaction is active by default. See README for installation and validation scope.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS.txt \
            --title "SuperLcm $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease
